<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Item page — tickets carousel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#123F42}a:hover{color:#0b2a2c}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 980px; box-sizing: border-box; background: #FCFAF7; font-family: Heebo, Arial, sans-serif; color: #123F42; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #726B66">אטרקציה</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3">הפועל תל אביב - הפועל פתח תקווה</h1>
</div>

<section style="background: #FFFFFF; border: 1px solid #E7E1DA; border-radius: 16px; box-shadow: 0 2px 10px rgba(28,35,36,.04); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<h2 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3">כרטיסים ומסמכים</h2>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between">
<b style="font-size: 17px; font-weight: 600">כרטיסים: 2 מתוך 5 משתתפים</b>
<span style="width: 72px; height: 6px; border-radius: 3px; background: #E7E1DA; display: flex"><span style="width: 40%; height: 6px; border-radius: 3px; background: #123F42"></span></span>
</div>
<span style="font-size: 15px; color: #726B66">ללא כרטיס: דניאל, עמית, עפרי</span>
</div>

<div style="margin: 0 -16px; overflow: hidden">
<div style="display: flex; gap: 12px; padding: 0 16px; transition: transform 180ms ease-out; transform: {{trackTransform}}">
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
<div style="flex: 0 0 290px; box-sizing: border-box; border: 1px solid {{t.border}}; border-radius: 16px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 10px; opacity: {{t.opacity}}; transition: opacity 180ms ease-out">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#123F42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2"></path></svg><b style="font-size: 20px; font-weight: 600">{{t.holder}}</b></span>
<span style="font-size: 13px; padding: 3px 10px; border-radius: 999px; background: {{t.chipBg}}; border: 1px solid {{t.chipBorder}}; color: #123F42; white-space: nowrap">{{t.status}}</span>
</div>
<span style="font-size: 16px">{{t.seat}}</span>
<bdi style="font-size: 14px; color: #726B66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.file}}</bdi>
<div style="display: flex; align-items: center; gap: 8px; border-top: 1px solid #E7E1DA; padding-top: 10px">
<sc-if value="{{t.confirmed}}" hint-placeholder-val="{{ true }}">
<label style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 15px; margin-left: auto"><input type="checkbox" style="width: 20px; height: 20px; margin: 0">נוצל</label>
</sc-if>
<sc-if value="{{t.unconfirmed}}" hint-placeholder-val="{{ false }}">
<button style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #123F42; color: #FFFFFF; font-family: Heebo, Arial, sans-serif; font-size: 15px; font-weight: 600; margin-left: auto">אישור ככרטיס</button>
</sc-if>
<a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #E7E1DA; border-radius: 12px; display: flex; align-items: center; font-size: 15px; text-decoration: none; color: #123F42">פתיחה</a>
<button aria-label="פעולות נוספות" style="width: 44px; height: 44px; border: 1px solid #E7E1DA; border-radius: 12px; background: #FFFFFF; color: #123F42; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 4px">
<sc-for list="{{tickets}}" as="d" hint-placeholder-count="3">
<button aria-label="{{d.dotLabel}}" onClick="{{d.pick}}" style="width: 28px; height: 28px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{d.dot}}"></span></button>
</sc-for>
<bdi style="font-size: 13px; color: #726B66; margin-right: 6px">{{counter}}</bdi>
</div>

<div style="border-top: 1px solid #E7E1DA; padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; color: #726B66">מסמכים נוספים</span>
<div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border: 1px solid #E7E1DA; border-radius: 12px; padding: 0 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#123F42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"></path></svg>
<bdi style="flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[מסמך נוסף].pdf</bdi>
<a href="#" style="min-height: 44px; padding: 0 12px; border: 1px solid #E7E1DA; border-radius: 12px; display: flex; align-items: center; font-size: 14px; text-decoration: none; color: #123F42">פתיחה</a>
<button aria-label="פעולות נוספות" style="width: 44px; height: 44px; border: 1px solid #E7E1DA; border-radius: 12px; background: #FFFFFF; color: #123F42; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</div>

<button style="min-height: 48px; border: 1.5px dashed #E7E1DA; border-radius: 12px; background: #FFFFFF; color: #123F42; font-family: Heebo, Arial, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>הוספת מסמך</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 0;
const raw = [
{ holder: 'אייל בן יצחק', seat: 'כרטיס B, שורה 4, כסא 26', file: 'AE-002_order1955108.pdf', confirmed: true },
{ holder: 'פאולה כהן', seat: '[שער / שורה / כסא]', file: 'Screenshot_20260917_105638_HTAFC.jpg', confirmed: false },
{ holder: '[משתתף]', seat: '[שער / שורה / כסא]', file: '[קובץ כרטיס].pdf', confirmed: true }
];
const tickets = raw.map((t, i) => ({
...t,
unconfirmed: !t.confirmed,
status: t.confirmed ? 'כרטיס מאושר' : 'לא אושר ככרטיס',
chipBg: t.confirmed ? '#E8F3F1' : '#FFFFFF',
chipBorder: t.confirmed ? '#E8F3F1' : '#E7E1DA',
border: i === sel ? '#123F42' : '#E7E1DA',
opacity: i === sel ? 1 : 0.55,
dot: i === sel ? '#123F42' : '#E7E1DA',
dotLabel: 'כרטיס ' + (i + 1),
pick: () => this.setState({ sel: i })
}));
return { tickets, trackTransform: 'translateX(' + (sel * 302) + 'px)', counter: (sel + 1) + ' / ' + raw.length };
}
}
</script>
</body>
</html>
